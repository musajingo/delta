[package]
name = "patch-field"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Three-state PATCH field type; absent, null, or a value."
authors = ["Musa Mahmoud Jingo <dev.musajingo@pm.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/musamahmoudjingo/patch-field"
keywords = ["patch", "nullable"]
categories = ["encoding"]

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false}

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive", "std"] }
serde_json = "1.0.151"

[features]
default = ["serde"]
serde = ["dep:serde"]
